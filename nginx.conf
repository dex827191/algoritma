worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 4096; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    error_log /dev/stderr warn;
    client_max_body_size 0;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 3600s;

    # Panel backend (app.py)
    upstream panel_backend { server 127.0.0.1:2053; }
    # SSH WS backend (ws-proxy.py)
    upstream ssh_ws_backend { server 127.0.0.1:8880; }

    # Kalau path "/" tapi ada Upgrade: websocket → SSH, selain itu → panel
    map $http_upgrade $root_backend {
        default          panel_backend;
        ~*websocket      ssh_ws_backend;
    }
    map $http_upgrade $connection_upgrade {
        default          "";
        ~*websocket      upgrade;
    }

    server {
        listen 0.0.0.0:8080;

        # ---- SSH via WebSocket ----
        location = /ssh {
            proxy_pass http://127.0.0.1:8880;
            proxy_http_version 1.1;
            proxy_set_header Host               $host;
            proxy_set_header CF-Connecting-IP   $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header Upgrade            $http_upgrade;
            proxy_set_header Connection         "upgrade";
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ---- Xray: VLESS ----
        location ^~ /xhttp        { proxy_pass http://127.0.0.1:18080; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header Connection ""; proxy_buffering off; proxy_request_buffering off; proxy_read_timeout 3600s; proxy_send_timeout 3600s; }
        location ^~ /httpup       { proxy_pass http://127.0.0.1:18081; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_buffering off; proxy_read_timeout 3600s; }
        location ^~ /vless        { proxy_pass http://127.0.0.1:18082; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_buffering off; proxy_read_timeout 3600s; }

        # ---- Xray: VMess ----
        location ^~ /vmess-xhttp  { proxy_pass http://127.0.0.1:18083; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header Connection ""; proxy_buffering off; proxy_request_buffering off; proxy_read_timeout 3600s; proxy_send_timeout 3600s; }
        location ^~ /vmess-httpup { proxy_pass http://127.0.0.1:18084; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_buffering off; proxy_read_timeout 3600s; }
        location ^~ /vmess        { proxy_pass http://127.0.0.1:18085; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_buffering off; proxy_read_timeout 3600s; }

        # ---- Xray: Trojan ----
        location ^~ /trojan-xhttp { proxy_pass http://127.0.0.1:18086; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header Connection ""; proxy_buffering off; proxy_request_buffering off; proxy_read_timeout 3600s; proxy_send_timeout 3600s; }
        location ^~ /trojan-httpup{ proxy_pass http://127.0.0.1:18087; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_buffering off; proxy_read_timeout 3600s; }
        location ^~ /trojan       { proxy_pass http://127.0.0.1:18088; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_buffering off; proxy_read_timeout 3600s; }

        # ---- Panel (fallback) ----
        location / {
            proxy_pass http://$root_backend;
            proxy_http_version 1.1;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header CF-Connecting-IP   $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_set_header Upgrade            $http_upgrade;
            proxy_set_header Connection         $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}