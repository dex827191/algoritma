name: "Build Xray Core"

on:
  workflow_dispatch:
  push:
    paths:
      - 'version.properties'
      - '.github/workflows/build-xray-core.yml'
  release:
    types: [published]

jobs:
  build-xray-core:
    name: Build Xray-core (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            goarch: arm64
            cc: aarch64-linux-android24-clang
          - abi: x86_64
            goarch: amd64
            cc: x86_64-linux-android24-clang

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read Versions
        run: |
          echo "XRAY_VERSION=$(grep 'XRAY_CORE_VERSION' version.properties | cut -d '=' -f 2 | tr -d ' ')" >> $GITHUB_ENV
          echo "GO_VERSION=$(grep 'GO_VERSION' version.properties | cut -d '=' -f 2 | tr -d ' ')" >> $GITHUB_ENV

      - name: Show Versions
        run: |
          echo "XRAY_VERSION = $XRAY_VERSION"
          echo "GO_VERSION   = $GO_VERSION"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Download & Extract NDK
        run: |
          wget -qO android-ndk.zip https://dl.google.com/android/repository/android-ndk-r28c-linux.zip
          unzip -q android-ndk.zip
          rm android-ndk.zip
          NDK_HOME=$(realpath android-ndk-*)
          echo "NDK_HOME=$NDK_HOME" >> $GITHUB_ENV

      - name: Clone Xray-core
        run: |
          git clone --depth 1 --branch "${{ env.XRAY_VERSION }}" \
            https://github.com/XTLS/Xray-core.git
          cd Xray-core
          echo "COMMID=$(git rev-parse --short=7 HEAD)" >> $GITHUB_ENV

      - name: Build Xray-core (${{ matrix.abi }})
        working-directory: Xray-core
        env:
          GOOS: android
          CGO_ENABLED: "1"
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ env.NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.cc }}
        run: |
          echo "Building for ${{ matrix.abi }} ($GOARCH) ..."
          go build -o xray \
            -trimpath -buildvcs=false \
            -ldflags="-X github.com/xtls/xray-core/core.build=${COMMID} -s -w -buildid= -checklinkname=0" \
            -v ./main
          ls -lh xray
          file xray

      - name: Package Artifact (${{ matrix.abi }})
        run: |
          mkdir -p out/${{ matrix.abi }}
          cp Xray-core/xray out/${{ matrix.abi }}/libxray.so
          # Sertakan info build
          cat > out/${{ matrix.abi }}/BUILD_INFO.txt <<EOF
          Xray-core version : ${{ env.XRAY_VERSION }}
          Commit            : ${{ env.COMMID }}
          ABI               : ${{ matrix.abi }}
          GOARCH            : ${{ matrix.goarch }}
          Go version        : ${{ env.GO_VERSION }}
          NDK               : r28c
          EOF

      - name: Upload Artifact (${{ matrix.abi }})
        uses: actions/upload-artifact@v4
        with:
          name: xray-core-${{ matrix.abi }}-${{ env.XRAY_VERSION }}
          path: out/${{ matrix.abi }}/
          if-no-files-found: error
          retention-days: 14
