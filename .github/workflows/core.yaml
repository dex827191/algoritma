name: "Build Xray"

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
  release:
    types:
      - published

jobs:
  build:
    name: Build Xray
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: true

      - name: Read Versions
        run: |
          echo "XRAY_VERSION=$(grep 'XRAY_CORE_VERSION' version.properties | cut -d '=' -f 2)" >> $GITHUB_ENV
          echo "GO_VERSION=$(grep 'GO_VERSION' version.properties | cut -d '=' -f 2)" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Build Xray-core from Source
        run: |
          # -checklinkname=0: Go 1.23+ 收紧了 //go:linkname 校验，而 Xray 的间接依赖
          # github.com/wlynxg/anet v0.0.5 仍 linkname 到 net.zoneCache，会链接失败。

          # Setup NDK
          wget -qO android-ndk.zip https://dl.google.com/android/repository/android-ndk-r28c-linux.zip
          unzip -q android-ndk.zip
          rm android-ndk.zip
          NDK_HOME=$(realpath android-ndk-*)

          # Clone Xray-core & checkout tag
          git clone https://github.com/XTLS/Xray-core.git
          cd Xray-core
          git checkout ${{ env.XRAY_VERSION }}
          COMMID=$(git rev-parse HEAD | cut -c 1-7)

          export GOOS=android
          export CGO_ENABLED=1

          mkdir -p ../out

          # ---- arm64-v8a ----
          echo "Building arm64-v8a..."
          export GOARCH=arm64
          unset GOARM
          export CC=$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          go build -o xray -trimpath -buildvcs=false \
            -ldflags="-X github.com/xtls/xray-core/core.build=${COMMID} -s -w -buildid= -checklinkname=0" \
            -v ./main
          mv xray ../out/libxray-arm64-v8a.so

          # ---- armeabi-v7a ----
          echo "Building armeabi-v7a..."
          export GOARCH=arm
          export GOARM=7
          export CC=$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang
          go build -o xray -trimpath -buildvcs=false \
            -ldflags="-X github.com/xtls/xray-core/core.build=${COMMID} -s -w -buildid= -checklinkname=0" \
            -v ./main
          mv xray ../out/libxray-armeabi-v7a.so

          # ---- x86_64 ----
          echo "Building x86_64..."
          export GOARCH=amd64
          unset GOARM
          export CC=$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang
          go build -o xray -trimpath -buildvcs=false \
            -ldflags="-X github.com/xtls/xray-core/core.build=${COMMID} -s -w -buildid= -checklinkname=0" \
            -v ./main
          mv xray ../out/libxray-x86_64.so

          # ---- x86 ----
          echo "Building x86..."
          export GOARCH=386
          unset GOARM
          export CC=$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/i686-linux-android24-clang
          go build -o xray -trimpath -buildvcs=false \
            -ldflags="-X github.com/xtls/xray-core/core.build=${COMMID} -s -w -buildid= -checklinkname=0" \
            -v ./main
          mv xray ../out/libxray-x86.so

          echo "=== Hasil build ==="
          ls -lh ../out/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xray-core
          path: out/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release'

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: "xray-core"
          merge-multiple: true

      - name: Upload artifacts to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in release/libxray-*.so; do
            gh release upload ${{ github.event.release.tag_name }} "$i" --clobber
          done