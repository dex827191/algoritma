<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SSH & Xray Panel</title><style>
:root{color-scheme:dark;--bg:#0b1020;--card:#151d31;--line:#293650;--accent:#62d6b5;--txt:#eaf1ff;--muted:#9eabc4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px system-ui}header{padding:22px max(18px,calc((100% - 1100px)/2));background:#111a2b;border-bottom:1px solid var(--line)}h1{margin:0;font-size:22px}main{max-width:1100px;margin:auto;padding:20px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;background:#263650;color:white;font-weight:650}button.active,button.primary{background:var(--accent);color:#092018}input,select,textarea{width:100%;padding:11px;border-radius:8px;border:1px solid var(--line);background:#0e1628;color:var(--txt);margin:5px 0 12px}label{color:var(--muted);font-size:13px}.panel{display:none}.panel.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.result,pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0b1324;padding:12px;border-radius:8px}.muted{color:var(--muted)}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px;border-bottom:1px solid var(--line)}.small{font-size:12px}
</style></head><body><header><h1>SSH & Xray Panel</h1><div class="muted">Kelola akun server dan generator konfigurasi</div></header><main><nav class="tabs"><button class="active" data-tab="ssh">Akun SSH</button><button data-tab="xray">Akun Xray</button><button data-tab="generator">Generator Config</button><button data-tab="admin">Admin & Status</button></nav>
<section id="ssh" class="panel active"><div class="card"><h2>Buat Akun SSH</h2><div class="grid"><div><label>Username</label><input id="sshuser" placeholder="username"></div><div><label>Password</label><input id="sshpass" placeholder="password"></div></div><button class="primary" onclick="createSsh()">Buat akun</button><pre id="sshresult"></pre></div><div class="card"><h2>Daftar akun SSH</h2><button onclick="loadSsh()">Muat ulang</button><div id="sshlist"></div></div></section>
<section id="xray" class="panel"><div class="card"><h2>Akun Xray</h2><p class="muted">Login admin diperlukan untuk mengelola akun.</p><label>Nama akun</label><input id="xname" placeholder="nama-akun"><button class="primary" onclick="createXray()">Tambah akun Xray</button><div id="xlist"></div></div></section>
<section id="generator" class="panel"><div class="card"><h2>Generator Akun / Config</h2><div class="grid"><div><label>UUID / Password</label><input id="gid" value=""></div><div><label>Domain tujuan</label><input id="domain" placeholder="domain.example"></div><div><label>Bug Host / SNI</label><input id="bug" placeholder="bug.example"></div><div><label>Port target</label><select id="port"><option>443</option><option>80</option><option>8080</option><option>2053</option><option>2083</option><option>2087</option><option>2096</option><option>8443</option></select></div><div><label>Path WebSocket</label><input id="path" value="/vless"></div><div><label>Format</label><select id="fmt"><option value="uri">Link URI</option><option value="json">JSON</option><option value="yaml">YAML</option></select></div></div><div class="grid" id="genbuttons"></div><pre id="genout" class="result">Hasil konfigurasi akan tampil di sini.</pre><button onclick="copyOut()">Salin hasil</button></div></section>
<section id="admin" class="panel"><div class="card"><h2>Login / Password Admin</h2><label>Password admin</label><input id="adminpass" type="password"><div class="grid"><button class="primary" onclick="login()">Login</button><button onclick="setupPass()">Atur password</button></div><pre id="adminresult"></pre></div><div class="card"><h2>Status server</h2><button onclick="stats()">Refresh status</button><pre id="statsout"></pre></div></section></main>
<script>
let token='';document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab],.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')});const api=async(p,opt={})=>{let r=await fetch(p,opt);return r.json()},enc=s=>encodeURIComponent(s);async function createSsh(){let d=await api('/api/add?user='+enc(sshuser.value)+'&pass='+enc(sshpass.value));sshresult.textContent=d.message||JSON.stringify(d);loadSsh()}async function loadSsh(){let d=await api('/api/list');sshlist.innerHTML='<table><tr><th>User</th><th>Password</th><th>IP</th><th>Action</th></tr>'+((d.users||[]).map(u=>`<tr><td>${u.username}</td><td>${u.password}</td><td>${u.ip}</td><td><button onclick="delSsh('${u.username}')">Hapus</button></td></tr>`).join(''))+'</table>'}async function delSsh(u){let d=await api('/api/delete?user='+enc(u)+'&token='+enc(token));alert(d.message);loadSsh()}async function login(){let d=await api('/api/login?pass='+enc(adminpass.value));if(d.status==='success')token=d.token;adminresult.textContent=d.message||'Login berhasil';loadXray()}async function setupPass(){let d=await api('/api/setup-pass?pass='+enc(adminpass.value));adminresult.textContent=d.message}async function createXray(){let d=await api('/api/xray/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:xname.value,token})});alert(d.message);loadXray()}async function loadXray(){if(!token)return;let d=await api('/api/xray/list?token='+enc(token));xlist.innerHTML=(d.accounts||[]).map(a=>`<div class="result">${a.name} · ${a.id} <button onclick="delXray('${a.id}')">Hapus</button></div>`).join('')}async function delXray(id){let d=await api('/api/xray/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,token})});alert(d.message);loadXray()}async function stats(){statsout.textContent=JSON.stringify(await api('/api/stats'),null,2)}function uuid(){return crypto.randomUUID()}gid.value=uuid();const protocols=['VLESS','VMess','Trojan'];['ws','tls','grpc','reality','sni_reverse'].forEach(type=>protocols.forEach(proto=>{let b=document.createElement('button');b.textContent=proto+' '+type.toUpperCase().replace('_',' ');b.onclick=()=>generate(proto.toLowerCase(),type);genbuttons.appendChild(b)}));function generate(proto,type){let id=gid.value||uuid(),host=domain.value||location.hostname,bughost=bug.value||host,p=port.value,pathv=path.value||'/'+proto,link='';if(type==='reality')link=`${proto}://${id}@${host}:${p}?security=reality&type=tcp&sni=${encodeURIComponent(bughost)}#${proto}-reality`;else if(type==='grpc')link=`${proto}://${id}@${host}:${p}?type=grpc&serviceName=${encodeURIComponent(pathv.replace(/^\//,''))}#${proto}-grpc`;else link=`${proto}://${id}@${host}:${p}?type=ws&security=${type==='tls'?'tls':'none'}&host=${encodeURIComponent(bughost)}&path=${encodeURIComponent(pathv)}#${proto}-${type}`;let obj={protocol:proto,uuid:id,address:host,port:Number(p),type,host:bughost,path:pathv,link};let f=fmt.value;genout.textContent=f==='json'?JSON.stringify(obj,null,2):f==='yaml'?Object.entries(obj).map(([k,v])=>k+': '+JSON.stringify(v)).join('\n'):link}function copyOut(){navigator.clipboard?.writeText(genout.textContent)}loadSsh();stats();
</script></body></html>
