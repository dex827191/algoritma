<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6750a4"><title>Server Panel • Material 3</title>
<style>
:root{color-scheme:light;--primary:#6750a4;--on-primary:#fff;--primary-container:#eaddff;--on-primary-container:#21005d;--secondary:#625b71;--surface:#fffbfe;--surface-low:#f7f2fa;--surface-high:#ece6f0;--surface-highest:#e6e0e9;--outline:#79747e;--outline-soft:#cac4d0;--text:#1d1b20;--muted:#49454f;--success:#386a20;--success-bg:#d7f5c4;--error:#b3261e;--radius:18px;--shadow:0 1px 3px #0001,0 8px 24px #0000000a}
*{box-sizing:border-box}body{margin:0;background:var(--surface-low);color:var(--text);font:14px/1.5 Inter,Roboto,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:264px;background:var(--surface);border-right:1px solid var(--outline-soft);padding:18px 14px;display:flex;flex-direction:column;z-index:5;transition:transform .25s}.brand{display:flex;align-items:center;gap:12px;padding:8px 10px 22px;font-weight:750;font-size:17px}.brandmark{width:40px;height:40px;border-radius:14px;background:var(--primary);color:white;display:grid;place-items:center;font-size:21px}.navlabel{font-size:11px;letter-spacing:1.1px;color:var(--muted);font-weight:700;padding:10px 14px}.nav button{width:100%;border:0;background:transparent;color:var(--muted);padding:12px 16px;border-radius:30px;text-align:left;display:flex;gap:14px;align-items:center;margin:3px 0;font-weight:600}.nav button.active{background:var(--primary-container);color:var(--on-primary-container)}.nav button:hover{background:var(--surface-high)}.nav .ico{width:22px;text-align:center;font-size:18px}.sidefoot{margin-top:auto;border-top:1px solid var(--outline-soft);padding:16px 8px 4px}.status{display:inline-flex;align-items:center;gap:8px;border-radius:30px;padding:7px 12px;background:var(--surface-high);font-size:12px;font-weight:650}.dot{width:8px;height:8px;background:#2e7d32;border-radius:50%;box-shadow:0 0 0 4px #2e7d3218}.main{margin-left:264px;min-width:0}.topbar{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;background:#fffbfeeF;border-bottom:1px solid #e6e0e9;position:sticky;top:0;z-index:3;backdrop-filter:blur(12px)}.top-left{display:flex;align-items:center;gap:14px}.topbar h2{font-size:16px;margin:0}.top-actions{display:flex;gap:10px;align-items:center}.content{max-width:1100px;margin:auto;padding:28px 30px 60px}.page-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;gap:12px}.page-head h1{font-size:26px;letter-spacing:-.5px;margin:0 0 4px}.page-head p{color:var(--muted);margin:0}.card{background:var(--surface);border:1px solid #e7e1e9;border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.card h3{font-size:16px;margin:0 0 15px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid.five{grid-template-columns:repeat(5,minmax(0,1fr))}.stat{padding:17px;border-radius:16px;background:var(--surface);border:1px solid #e7e1e9;min-width:0}.stat .k{color:var(--muted);font-size:11px;font-weight:750;letter-spacing:.7px;text-transform:uppercase}.stat .v{font-size:17px;font-weight:750;margin-top:8px;overflow-wrap:anywhere}.stat .sub{font-size:12px;color:var(--muted);margin-top:3px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px;min-width:0}.field label{font-size:12px;font-weight:700;color:var(--muted)}.field input,.field select,.field textarea{width:100%;border:1px solid var(--outline);background:var(--surface);border-radius:10px;padding:12px 13px;color:var(--text);outline:none;min-width:0}.field input:focus,.field select:focus,.field textarea:focus{border:2px solid var(--primary);padding:11px 12px}.row{display:flex;gap:12px;align-items:end}.row>*{flex:1;min-width:0}.btn{border:0;border-radius:28px;padding:11px 18px;min-height:42px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.15s}.btn:disabled{opacity:.55;cursor:not-allowed}.filled{background:var(--primary);color:white}.filled:hover{box-shadow:0 2px 8px #6750a455}.tonal{background:var(--primary-container);color:var(--on-primary-container)}.outlined{background:transparent;color:var(--primary);border:1px solid var(--outline-soft)}.danger{background:#f9dedc;color:#410e0b}.textbtn{background:transparent;color:var(--primary);padding:8px 12px}.wide{width:100%}.chip{display:inline-flex;align-items:center;border-radius:30px;background:var(--surface-high);padding:5px 10px;font-size:11px;font-weight:700;color:var(--muted)}.chip.good{background:var(--success-bg);color:var(--success)}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:460px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #e7e1e9}th{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.6px}td{font-size:13px}.mono,pre{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;overflow-wrap:anywhere}.muted{color:var(--muted)}.output{background:#f3eff7;border-radius:12px;padding:14px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:330px;overflow:auto;font-size:12px}.notice{background:#f1ebfa;color:#403653;padding:13px 15px;border-radius:13px;font-size:12px}.hidden{display:none!important}.hamb{display:none}.overlay{display:none}.toast{position:fixed;right:20px;bottom:20px;z-index:20;background:#302d35;color:white;padding:13px 18px;border-radius:14px;box-shadow:var(--shadow);max-width:min(90vw,420px)}.toast.error{background:#b3261e}.toast.success{background:#286b35}.modal{position:fixed;inset:0;background:#17131d77;z-index:15;display:grid;place-items:center;padding:20px}.modalbox{background:var(--surface);border-radius:24px;padding:24px;width:min(100%,420px);box-shadow:var(--shadow)}.modalbox h3{margin:0 0 8px}.bar{height:8px;border-radius:20px;background:var(--surface-high);overflow:hidden;margin-top:9px}.bar span{display:block;height:100%;background:var(--primary);border-radius:20px}.traffic{display:grid;grid-template-columns:1fr 1fr;gap:12px}.traffic>div{background:var(--surface-high);border-radius:14px;padding:14px}.genbuttons{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.genbuttons button{font-size:12px;padding:12px 6px}.linkbox{background:var(--surface-high);padding:12px;border-radius:12px;margin:8px 0}.linktop{display:flex;justify-content:space-between;gap:8px;align-items:center}.small{font-size:11px}.mt{margin-top:14px}.right{text-align:right}.empty{text-align:center;color:var(--muted);padding:25px}.mobile-only{display:none}
@media(max-width:1000px){.grid.five{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.five .stat:first-child{grid-column:span 2}}
@media(max-width:760px){.sidebar{transform:translateX(-105%);width:285px;box-shadow:var(--shadow)}.sidebar.open{transform:translateX(0)}.overlay.show{display:block;position:fixed;inset:0;background:#17131d66;z-index:4}.main{margin-left:0}.topbar{height:62px;padding:0 16px}.content{padding:22px 15px 45px}.hamb,.mobile-only{display:inline-flex}.page-head h1{font-size:23px}.grid.five{grid-template-columns:repeat(2,minmax(0,1fr))}.row{flex-direction:column;align-items:stretch;gap:0}.row .btn{width:100%}.top-actions .admin-label{display:none}}
@media(max-width:430px){.card{padding:16px}.stat{padding:14px}.stat .v{font-size:15px}.genbuttons{gap:6px}.genbuttons button{font-size:10px;padding:11px 3px}.page-head{flex-direction:column}.traffic{gap:8px}}
</style></head>
<body>
<div class="app">
<div class="overlay" id="overlay" onclick="toggleNav(false)"></div>
<aside class="sidebar" id="sidebar"><div class="brand"><div class="brandmark">✦</div><div>SERVER PANEL<div class="muted small" style="font-weight:500">Management Console</div></div></div>
<div class="navlabel">MENU UTAMA</div><nav class="nav">
<button data-page="dashboard" class="active" onclick="navigate('dashboard')"><span class="ico">▦</span>Dashboard</button>
<button data-page="ssh" onclick="navigate('ssh')"><span class="ico">♙</span>Buat Akun SSH</button>
<button data-page="xray" onclick="navigate('xray')"><span class="ico">◉</span>Buat Akun Xray</button>


</nav><div class="sidefoot"><div class="status" id="sideStatus">● Public Self-Service</div></div></aside>
<div class="main"><header class="topbar"><div class="top-left"><button class="btn textbtn hamb" onclick="toggleNav(true)">☰</button><h2 id="topTitle">Dashboard</h2></div><div class="top-actions"><span class="chip good" id="serverState">● Connecting</span></div></header>
<main class="content" id="view"></main></div></div>
<div id="toast" class="toast hidden"></div>
<script>
'use strict';
const $=id=>document.getElementById(id);let stats=null,adminToken='',passConfigured=false,currentPage='dashboard',sshUsers=[],xrayAccounts=[],selectedCreated=null,serverInfo=null,modalMode='login',lastSSHResult='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg,type=''){const el=$('toast');el.textContent=msg;el.className='toast '+type;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.add('hidden'),3500)}
async function api(url,opts={}){const r=await fetch(url,opts);let d;try{d=await r.json()}catch{throw Error('Respons server tidak valid')}if(!r.ok&&d.status!=='error')throw Error(d.message||`HTTP ${r.status}`);return d}
function toggleNav(v){$('sidebar').classList.toggle('open',v);$('overlay').classList.toggle('show',v)}
function navigate(page){currentPage=page;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('topTitle').textContent=({dashboard:'Dashboard',ssh:'Buat Akun SSH',xray:'Buat Akun Xray',settings:'Pengaturan SSH'})[page];toggleNav(false);render()}
function adminUI(){$('sideStatus').textContent='● Public Self-Service';}
function openModal(){}
function closeModal(){}
function openChangePass(){}
function adminAction(){}
async function submitModal(){}
async function loadStats(){try{stats=await api('/api/stats');passConfigured=false;$('serverState').textContent='● '+(stats.status||'ONLINE');$('serverState').className='chip good';adminUI();if(currentPage==='dashboard'||currentPage==='settings')render()}catch(e){$('serverState').textContent='● Offline';$('serverState').className='chip';}}
function card(title,body){return `<section class="card"><h3>${title}</h3>${body}</section>`}
function render(){if(currentPage==='dashboard')renderDashboard();if(currentPage==='ssh')renderSSH();if(currentPage==='xray')renderXray();if(currentPage==='settings')renderSettings();}
function renderDashboard(){const s=stats||{};const values=[['CPU MODEL',s.cpu_model||'Memuat...','Processor server'],['RAM USED / TOTAL',(s.ram_used||'--')+' / '+(s.ram_total||'--'),'Penggunaan memori'],['DISK USAGE',s.disk_usage||'--','Storage root'],['SERVER UPTIME',s.uptime||'--','Waktu aktif'],['SSH ONLINE',(s.ssh_online||'0')+' Active',s.user_list_details||'']];$('view').innerHTML=`<div class="page-head"><div><h1>Dashboard Server</h1><p>Ringkasan status dan performa server kamu.</p></div><span class="chip good">● Services Managed</span></div><div class="grid five">${values.map(v=>`<div class="stat"><div class="k">${v[0]}</div><div class="v">${esc(v[1])}</div><div class="sub">${esc(v[2])}</div></div>`).join('')}</div>${card('Traffic Metrics',`<div class="traffic"><div><div class="muted small">↓ DOWNLOAD</div><b style="font-size:22px">128.4 MB</b><div class="sub">Kecepatan simulasi: <span id="dlSpeed">${(100+Math.random()*100).toFixed(1)}</span> KB/s</div></div><div><div class="muted small">↑ UPLOAD</div><b style="font-size:22px">96.2 MB</b><div class="sub">Kecepatan simulasi: <span id="ulSpeed">${(100+Math.random()*150).toFixed(2)}</span> KB/s</div></div></div><div class="mt"><div class="muted small">NETWORK ACTIVITY · LIVE VISUAL</div><div style="height:65px;display:flex;gap:3px;align-items:end;margin-top:8px">${Array.from({length:35},()=>`<i style="display:block;flex:1;height:${10+Math.random()*90}%;border-radius:4px 4px 0 0;background:#8b78bd"></i>`).join('')}</div></div>`)}${card('Info Pengaturan Server',`<div class="grid">${[['SSH Port',s.ws_proxy_cfg?.sshPort||22],['Go Proxy','8080'],['Nginx','8081'],['Panel API','3000'],['Xray','data/config.json'],['BBR',s.sys_settings?.enable_bbr==='true'?'ON':'OFF'],['UDPGW',s.sys_settings?.udpgw_port||7300]].map(x=>`<div><span class="muted">${x[0]}</span><br><b>${esc(x[1])}</b></div>`).join('')}</div>`)}${card('Domain & Service Paths',`<div class="field"><label>Domain Utama</label><div class="row"><input readonly value="${esc(s.domain||location.hostname)}"><button class="btn tonal" onclick="copyText('${esc(s.domain||location.hostname)}')">Salin</button></div></div><div class="field"><label>SSH WebSocket Path</label><input readonly value="/ (kosong / tanpa path)"></div><div class="field"><label>Xray Paths</label><input readonly value="/vless · /vmess · /trojan"></div>`)}`}
async function loadSsh(){try{const d=await api('/api/list');sshUsers=d.users||[]}catch(e){toast(e.message,'error')}}
async function renderSSH(){
 const head=`<div class="page-head"><div><h1>Daftar Akun SSH (<span id="sshCount">0</span>)</h1><p>Kelola akun SSH, buat akun baru, dan hapus akun yang tidak digunakan.</p></div><span class="chip">SSH WebSocket tanpa path</span></div>`;
 const form=card('Tambah Akun SSH',`<div class="row"><div class="field"><label>Username</label><input id="sshUser" placeholder="contoh: user01" autocomplete="off" maxlength="32"></div><div class="field"><label>Password</label><input id="sshPass" type="password" placeholder="Minimal 8 karakter" autocomplete="new-password"></div><button class="btn filled" onclick="createSSH()">＋ Buat Akun</button></div><div id="sshResult"></div><p class="muted small">Akun menggunakan Dropbear. Koneksi WebSocket memakai domain utama pada port publik tanpa /path.</p>`);
 $('view').innerHTML=head+form+card('Daftar Akun SSH',`<div id="sshList" class="empty">Memuat daftar akun...</div>`);
 await loadSSH();
}
async function loadSSH(){
 try{const d=await api('/api/list');sshUsers=d.users||[];const c=$('sshCount');if(c)c.textContent=sshUsers.length;const box=$('sshList');if(!box)return;box.innerHTML=sshUsers.length?`<div class="tablewrap"><table><thead><tr><th>No</th><th>Username</th><th>Dibuat</th><th>Aksi</th></tr></thead><tbody>${sshUsers.map((u,i)=>`<tr><td>${i+1}</td><td><b>${esc(u.username)}</b></td><td>${esc((u.created_at||'').slice(0,10)||'-')}</td><td><button class="btn danger" onclick="deleteSSH('${esc(u.username)}')">Hapus</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Belum ada akun SSH.</div>'}catch(e){const box=$('sshList');if(box)box.textContent='Gagal memuat daftar akun: '+e.message}
}
async function createSSH(){const u=$('sshUser').value.trim(),p=$('sshPass').value;if(!u||!p)return toast('Isi username dan password','error');try{const d=await api('/api/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:u,pass:p})});if(d.status==='success'){toast('Akun SSH berhasil dibuat','success');lastSSHResult=d.message;$('sshResult').innerHTML=`<div class="notice mt"><b>✓ Akun berhasil dibuat</b><pre class="output">${esc(d.message)}</pre><button class="btn tonal wide" onclick="copyText(${JSON.stringify(d.message).replace(/</g,'\\u003c')})">Salin Detail Akun</button></div>`;$('sshUser').value='';$('sshPass').value='';}else toast(d.message,'error')}catch(e){toast(e.message,'error')}}
function showSSHDetail(name){const u=sshUsers.find(x=>x.username===name);if(!u)return;$('sshDetail').innerHTML=`<div class="notice mt"><b>Detail Akun ${esc(u.username)}</b><p class="mono">Username: ${esc(u.username)}<br>Password: ${esc(u.password||'-')}<br>IP: ${esc(u.ip||'Unknown')}<br>Shell: ${esc(u.shell||'-')}</p><button class="btn tonal" onclick="copyText(${JSON.stringify(`Username: ${u.username}\nPassword: ${u.password||'-'}\nIP: ${u.ip||'Unknown'}\nShell: ${u.shell||'-'}`).replace(/</g,'\\u003c')})">Salin Semua</button></div>`}
async function deleteSSH(name){if(!confirm('Hapus akun SSH '+name+'?'))return;try{const d=await api('/api/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:name})});toast(d.message,d.status==='success'?'success':'error');if(d.status==='success')loadSSH()}catch(e){toast(e.message,'error')}}
async function loadXray(){
 try{const d=await api('/api/xray/list');xrayAccounts=d.accounts||[];const c=$('xrayCount');if(c)c.textContent=xrayAccounts.length;const box=$('xrayList');if(box)box.innerHTML=xrayAccounts.length?`<div class="tablewrap"><table><thead><tr><th>No</th><th>Nama</th><th>UUID</th><th>Aksi</th></tr></thead><tbody>${xrayAccounts.map((a,i)=>`<tr><td>${i+1}</td><td><b>${esc(a.name)}</b></td><td class="mono small">${esc(a.id)}</td><td><button class="btn danger" onclick="deleteXray('${esc(a.id)}')">Hapus</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Belum ada akun Xray.</div>'}catch(e){const box=$('xrayList');if(box)box.textContent='Gagal memuat daftar akun: '+e.message}
}
async function renderXray(){
 const head=`<div class="page-head"><div><h1>Daftar Akun Xray (<span id="xrayCount">0</span>)</h1><p>Kelola akun VLESS, VMess, dan Trojan.</p></div><span class="chip">Domain dari ENV</span></div>`;
 const form=card('Tambah Akun Xray',`<p class="muted small">Satu akun akan ditambahkan ke semua inbound yang tersedia di config.json.</p><div class="row"><div class="field"><label>Nama Akun</label><input id="xrayName" placeholder="user01" maxlength="24"></div><button class="btn filled" onclick="createXray()">＋ Buat Akun</button></div><div id="xrayCreated"></div>`);
 $('view').innerHTML=head+form+card('Daftar Akun Xray',`<div id="xrayList" class="empty">Memuat daftar akun...</div>`);
 await loadXray();
}
async function createXray(){const name=$('xrayName').value.trim();if(!/^[a-zA-Z0-9][a-zA-Z0-9_-]{0,23}$/.test(name))return toast('Nama 1–24 karakter: huruf, angka, _ atau -','error');try{const d=await api('/api/xray/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});if(d.status==='success'){toast(d.message,'success');showXray(d.account)}else toast(d.message,'error')}catch(e){toast(e.message,'error')}}
function makeXrayLinks(a){
 const host=(serverInfo?.domain||stats?.domain||location.hostname).replace(/^https?:\/\//,'').split('/')[0];
 const sni=host;
 const rows=[['VLESS','WebSocket','vless','ws','/vless'],['VMess','WebSocket','vmess','ws','/vmess'],['Trojan','WebSocket','trojan','ws','/trojan']];
 const variants=[{port:'443',security:'tls',label:'TLS ON'},{port:'80',security:'none',label:'TLS OFF'}];
 return rows.flatMap(([p,t,scheme,net,path])=>variants.map(v=>{
  let link;
  if(scheme==='vmess'){
   const o={v:'2',ps:`${a.name}-${p}-${t}-${v.port}`,add:host,port:v.port,id:a.id,aid:'0',scy:'auto',net,type:net==='xhttp'?'auto':'none',host,path,tls:v.security==='tls'?'tls':'',...(v.security==='tls'?{sni}:{}),...(net==='xhttp'?{mode:'auto'}:{})};
   link='vmess://'+btoa(unescape(encodeURIComponent(JSON.stringify(o))));
  }else{
   const q=new URLSearchParams({security:v.security,type:net,host,path});
   if(v.security==='tls')q.set('sni',sni);
   if(scheme==='vless')q.set('encryption','none');
   if(net==='xhttp')q.set('mode','auto');
   link=`${scheme}://${a.id}@${host}:${v.port}?${q}#${encodeURIComponent(`${a.name}-${p}-${t}-${v.label}`)}`;
  }
  return {p,t,path,port:v.port,security:v.label,link};
 }));
}
function showXray(id){const a=(id && typeof id==='object')?id:xrayAccounts.find(x=>x.id===id);if(!a)return;const links=makeXrayLinks(a);$('xrayCreated').innerHTML=`<section class="card"><h3>Akun Berhasil Dibuat: ${esc(a.name)}</h3><p class="small muted">UUID / Password Trojan</p><div class="row"><input readonly value="${esc(a.id)}"><button class="btn tonal" onclick="copyText('${esc(a.id)}')">Salin UUID</button></div>${['VLESS','VMess','Trojan'].map(p=>`<h3 class="mt">${p}</h3>${links.filter(x=>x.p===p).map(x=>`<div class="linkbox"><div class="linktop"><b>${x.t} · ${x.path} · Port ${x.port} · ${x.security}</b><button class="btn textbtn" onclick="copyText(${JSON.stringify(x.link).replace(/</g,'\\u003c')})">Salin</button></div><div class="mono small muted">${esc(x.link)}</div></div>`).join('')}`).join('')}</section>`;window.scrollTo({top:0,behavior:'smooth'})}
async function deleteXray(id){if(!confirm('Hapus akun Xray ini?'))return;try{const d=await api('/api/xray/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});toast(d.message,d.status==='success'?'success':'error');if(d.status==='success')loadXray()}catch(e){toast(e.message,'error')}}
async function saveSettings(){if(!adminToken){openModal('login');toast('Login admin diperlukan','error');return}const val=(sel,custom)=>$(sel).value==='custom'?$(custom).value:$(sel).value;const p=val('sshPort','sshPortCustom')||22,k=val('keepAlive','keepCustom')||15000,b=val('maxBuffer','bufferCustom')||32768;try{const a=await api(`/api/set-wsproxy?pass=${encodeURIComponent(adminToken)}&ssh_port=${p}&keep_alive=${k}&max_buffer=${b}`);const c=await api(`/api/set-system?pass=${encodeURIComponent(adminToken)}&banner=${encodeURIComponent($('banner').value)}&enable_bbr=${$('bbr').value}&udpgw_port=${$('udpgw').value}&udpgw_max_clients=${$('udpgwMax').value}`);toast(a.message+' '+c.message,a.status==='success'&&c.status==='success'?'success':'error');loadStats()}catch(e){toast(e.message,'error')}}
async function loadInfo(){try{serverInfo=await api('/__info')}catch{serverInfo=null}}
async function copyText(text){try{await navigator.clipboard.writeText(String(text));toast('Berhasil disalin','success')}catch{const t=document.createElement('textarea');t.value=text;document.body.append(t);t.select();document.execCommand('copy');t.remove();toast('Berhasil disalin','success')}}
(async()=>{await loadInfo();await loadStats();render();setInterval(loadStats,300000)})();
</script></body></html>
